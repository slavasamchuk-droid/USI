<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Реестр рекламных материалов — ЮгСтройИнвест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#0F2A6B;
  --blue-700:#1B45B8;
  --blue-500:#2D63E6;
  --blue-100:#E6EDFD;
  --blue-050:#F2F6FF;
  --bg:#F4F7FC;
  --card:#FFFFFF;
  --ink:#12203F;
  --ink-soft:#5C6B8A;
  --line:#E2E9F5;
  --sand:#E9D9AE;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-pill:999px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 44px}

/* ---------- Header ---------- */
.top{
  background:linear-gradient(180deg,#153AA8 0%,#1B45B8 60%,#2049C6 100%);
  color:#fff;padding:18px 0 60px;
}
.top-inner{max-width:1240px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:32px;display:block;border-radius:6px}
.brand-div{width:1px;height:24px;background:rgba(255,255,255,.28)}
.brand-txt{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#C9D6FF}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:16px 0 3px}
.sub{color:#C3D2FA;margin:0;font-size:13px}
.metrics{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.metric b{display:block;font-size:17px;font-weight:800;line-height:1.15}
.metric span{font-size:10.5px;color:#B9CAF8;text-transform:uppercase;letter-spacing:.08em}

/* ---------- Controls ---------- */
.panel{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:12px;margin-top:-42px;
  box-shadow:0 12px 28px rgba(15,42,107,.09);
}
.search{position:relative}
.search input{
  width:100%;border:1.5px solid var(--line);background:var(--blue-050);
  border-radius:var(--radius-pill);padding:10px 16px 10px 40px;
  font:inherit;color:var(--ink);outline:none;transition:.18s;
}
.search input:focus{border-color:var(--blue-500);background:#fff;box-shadow:0 0 0 4px rgba(45,99,230,.12)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{
  border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);
  border-radius:var(--radius-pill);padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;transition:.16s;
}
.chip:hover{border-color:var(--blue-500);color:var(--blue-700)}
.chip[aria-pressed="true"]{background:var(--blue-700);border-color:var(--blue-700);color:#fff}
.chip:focus-visible{outline:3px solid rgba(45,99,230,.4);outline-offset:2px}

/* ---------- Sections ---------- */
.section{margin-top:24px}
.section-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.section-head h2{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:0}
.section-head .count{
  font-size:11px;font-weight:700;color:var(--blue-700);
  background:var(--blue-100);border-radius:var(--radius-pill);padding:2px 8px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:12px 14px 6px;transition:.18s;
}
.card:hover{border-color:#C9D8F6;box-shadow:0 10px 26px rgba(15,42,107,.07)}
.card h3{margin:0 0 8px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--blue-500);flex:none}

.row{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:6px 0;border-top:1px solid var(--line);
}
.row-main{min-width:0}
.row-name{font-weight:600;font-size:13px;line-height:1.3;word-break:break-word}
.stamp{
  display:block;margin-top:1px;
  font-size:10.5px;font-weight:600;letter-spacing:.01em;
  color:#3A4A6B;background:none;border:0;border-radius:0;padding:0;
  white-space:nowrap;
}
.stamp.fresh{color:var(--blue-900);font-weight:700}
.btn{
  flex:none;border:none;border-radius:var(--radius-pill);
  padding:6px 13px;font:inherit;font-size:12.5px;font-weight:700;
  background:var(--blue-700);color:#fff;cursor:pointer;transition:.16s;
  display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{background:var(--blue-500);transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid rgba(45,99,230,.4);outline-offset:2px}
.btn.pdf{background:var(--blue-100);color:var(--blue-900)}
.btn.pdf:hover{background:#D6E2FC}
.btn.off{background:#EFF2F8;color:#93A1BC;cursor:default;transform:none}

.empty{
  text-align:center;padding:36px 20px;color:var(--ink-soft);
  background:#fff;border:1px dashed var(--line);border-radius:var(--radius-lg);margin-top:30px;
}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:12.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot a{color:var(--blue-700);font-weight:600}
@media(max-width:600px){
  h1{font-size:20px}
  .grid{grid-template-columns:1fr}
  .row{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- Рендер ---------- */
const out=document.getElementById('out');
const chips=document.getElementById('chips');
let active='Все разделы', query='';

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function daysAgo(str){
  const m=/^(\d{2})\.(\d{2})\.(\d{4})/.exec(str||'');
  if(!m) return null;
  const d=new Date(+m[3],+m[2]-1,+m[1]);
  return Math.floor((Date.now()-d)/86400000);
}

function stamp(it){
  if(!it.updated) return '<span class="stamp">обновлено — дата не указана</span>';
  const d=daysAgo(it.updated);
  const fresh=(d!==null && d<=45)?' fresh':'';
  return '<span class="stamp'+fresh+'">обновлено '+esc(it.updated)+'</span>';
}

function itemHTML(it){
  let btn;
  if(it.url) btn='<a class="btn" href="'+esc(it.url)+'" target="_blank" rel="noopener">Открыть</a>';
  else if(it.file) btn='<span class="btn pdf" title="'+esc(it.file)+'">PDF в таблице</span>';
  else btn='<span class="btn off">Ссылки нет</span>';
  return '<div class="row"><div class="row-main"><div class="row-name">'+esc(it.name)+'</div>'+stamp(it)+'</div>'+btn+'</div>';
}

function matches(sec,card,it){
  if(!query) return true;
  const hay=(sec+' '+card+' '+it.name+' '+(it.file||'')).toLowerCase();
  return query.split(/\s+/).every(w=>hay.includes(w));
}

function render(){
  let html='',shown=0;
  DATA.forEach(sec=>{
    if(active!=='Все разделы' && active!==sec.section) return;
    let body='',n=0;
    sec.cards.forEach(card=>{
      const items=card.items.filter(it=>matches(sec.section,card.jk,it));
      if(!items.length) return;
      n+=items.length;
      body+='<article class="card"><h3><span class="dot"></span>'+esc(card.jk)+'</h3>'+items.map(itemHTML).join('')+'</article>';
    });
    if(!n) return;
    shown+=n;
    html+='<section class="section"><div class="section-head"><h2>'+esc(sec.section)+'</h2><span class="count">'+n+'</span></div><div class="grid">'+body+'</div></section>';
  });
  out.innerHTML = shown ? html : '<div class="empty"><b>Ничего не нашлось</b><br>Измените запрос или выберите другой раздел.</div>';
}

// чипы разделов
['Все разделы',...DATA.map(s=>s.section)].forEach(name=>{
  const b=document.createElement('button');
  b.className='chip';b.textContent=name;b.setAttribute('aria-pressed',name===active);
  b.onclick=()=>{active=name;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();};
  chips.appendChild(b);
});

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render();});

// метрики
const allItems=DATA.flatMap(s=>s.cards.flatMap(c=>c.items));
document.getElementById('m-links').textContent=allItems.length;
document.getElementById('m-jk').textContent=new Set(DATA.flatMap(s=>s.cards.map(c=>c.jk))).size;
document.getElementById('m-sec').textContent=DATA.length;

render();
</script>
